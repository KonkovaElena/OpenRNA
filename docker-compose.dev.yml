# OpenRNA local development stack
# Usage: docker compose -f docker-compose.dev.yml up -d
# Postgres 16 with pgAdmin sidecar for local development and integration testing.

services:
  postgres:
    image: postgres:16-alpine
    container_name: openrna-postgres-dev
    environment:
      POSTGRES_USER: openrna
      POSTGRES_PASSWORD: openrna_dev_pass
      POSTGRES_DB: openrna_dev
    ports:
      - "5432:5432"
    volumes:
      - openrna_pgdata:/var/lib/postgresql/data
      - ./src/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrna -d openrna_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: openrna-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@openrna.local
      PGADMIN_DEFAULT_PASSWORD: dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  openrna_pgdata:
